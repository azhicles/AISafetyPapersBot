# fly.toml app configuration file generated for ai-safety-papers-bot on 2026-03-07T01:45:05+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-safety-papers-bot'
primary_region = 'sin'

[build]

[processes]
  app = 'python main.py'

[[mounts]]
  source = 'botdata'
  destination = '/app/data'


[restart]
  policy = 'always'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
